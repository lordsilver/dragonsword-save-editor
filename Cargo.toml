[workspace]
resolver = "3"
members = ["crates/core", "apps/desktop/src-tauri"]
default-members = ["crates/core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/lordsilver/dragonsword-save-editor"

[workspace.dependencies]
dsa-core = { path = "crates/core" }
aes = "0.8.4"
base64 = "0.22.1"
cbc = { version = "0.1.2", features = ["block-padding"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
hmac = "0.12.1"
pbkdf2 = "0.12.1"
rand = "0.8.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
subtle = "2.6.1"
tauri = { version = "2.12.4", features = [] }
tauri-build = { version = "2.7.3", features = [] }
tauri-plugin-dialog = "2.8.3"
thiserror = "2.0.21"
walkdir = "2.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"

# Opening or writing a save runs 256,000 PBKDF2-SHA512 rounds. Unoptimized,
# that takes about 5 s per open in `pnpm desktop`, against 0.1 s optimized.
# Dependencies rarely rebuild, so dev builds compile them optimized too, and
# dsa-core as well, because the generic PBKDF2/HMAC code is compiled there.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.dsa-core]
opt-level = 3

# Release builds, after Tauri's size guide (v2.tauri.app/concept/size): one
# codegen unit and fat LTO let LLVM optimise across crates, and strip drops
# the symbols. Speed over size (opt-level 3, not "s"), for the PBKDF2 above.
# Panics keep unwinding: a panic inside a command then fails that command
# instead of closing the app with the user's unsaved edits.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true
