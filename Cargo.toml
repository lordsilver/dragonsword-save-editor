[workspace]
resolver = "3"
members = ["crates/core", "apps/desktop/src-tauri"]
default-members = ["crates/core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
repository = "https://github.com/lordsilver/dragonsword-save-editor"

[workspace.dependencies]
dsa-core = { path = "crates/core" }
aes = "0.8.4"
base64 = "0.22.1"
cbc = { version = "0.1.2", features = ["block-padding"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
hmac = "0.12.1"
pbkdf2 = "0.12.1"
rand = "0.8.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
subtle = "2.6.1"
tauri = { version = "2.12.4", features = [] }
tauri-build = { version = "2.7.3", features = [] }
tauri-plugin-dialog = "2.8.3"
thiserror = "2.0.21"
walkdir = "2.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"
